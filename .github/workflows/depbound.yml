name: dependency-boundary

on:
  pull_request:
  push:
    branches: [main]

jobs:
  depbound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/depbound -config depbound.json
