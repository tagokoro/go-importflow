name: go-importflow

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go-importflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/go-importflow -config go-importflow.example.json
